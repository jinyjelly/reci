<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b9a7e8">
<title>내 레시피북</title>
<style>
:root{--bg:#f7f4fc;--card:#fff;--text:#332d3d;--muted:#81778f;--p:#9b86d3;--soft:#eee8fa;--line:#e7e0f1;--danger:#d96b86}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:700px;margin:auto;padding:14px 13px 40px}h1{font-size:25px;margin:8px 4px 16px}h2{font-size:18px;margin:0 0 12px}
.card,.recipe{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(90,70,130,.1)}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;color:var(--text);margin-bottom:10px}textarea{min-height:90px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.catbuttons,.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
button{font:inherit;cursor:pointer}.catbtn,.filterbtn,.secondary{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbf9fe;color:#665982;font-weight:700}
.catbtn.active,.filterbtn.active{background:#e4dafa;border-color:#a994d8}.primary{width:100%;border:0;border-radius:13px;padding:13px;background:var(--p);color:#fff;font-weight:800}.danger{border:0;border-radius:11px;padding:8px 10px;background:#fff0f3;color:var(--danger)}
.search{position:relative}.search span{position:absolute;left:13px;top:11px}.search input{padding-left:40px}
.filters{display:flex;overflow-x:auto}.filterbtn{white-space:nowrap}.recipe{padding:14px;margin-bottom:10px}.head{display:flex;justify-content:space-between}.title{font-size:17px;font-weight:800}.cat,.meta{font-size:12px;color:var(--muted);margin-top:4px}.star{font-size:24px;color:#9b86d3}.section{font-size:13px;line-height:1.55;white-space:pre-wrap;margin-top:9px}.actions{display:flex;gap:6px;margin-top:12px}.link{display:inline-block;margin-top:10px;color:#7256a8;font-weight:700;text-decoration:none}.empty{text-align:center;color:var(--muted);padding:25px}.modal{position:fixed;inset:0;background:#281e37aa;display:flex;align-items:flex-end;padding:12px;z-index:5}.box{width:min(700px,100%);max-height:94vh;overflow:auto;background:white;border-radius:22px;padding:18px}.modalhead{display:flex;justify-content:space-between}.close{border:0;border-radius:50%;background:#f1edf7;width:34px;height:34px}.hidden{display:none!important}.note{font-size:12px;color:var(--muted);line-height:1.5}
.photo-tools{display:flex;gap:8px;margin:-2px 0 10px}.photo-tools label{flex:1;margin:0;text-align:center}
.photo-btn{display:block;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbf9fe;color:#665982;font-weight:700;cursor:pointer}
.photo-preview,.detail-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.photo-item{position:relative}.photo-item img,.detail-photos img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#f5f1fa}
.photo-remove{position:absolute;right:4px;top:4px;width:25px;height:25px;border:0;border-radius:50%;background:#3b304dcc;color:white;font-size:16px;line-height:25px;padding:0}
.recipe{cursor:pointer}.recipe .star{cursor:pointer}.recipe-summary{font-size:13px;color:var(--muted);margin-top:8px}.recipe-summary:empty{display:none}
.detail-title{font-size:22px;font-weight:850;margin:4px 0}.detail-section{margin-top:18px;line-height:1.65;white-space:pre-wrap}
.detail-actions{display:flex;gap:8px;margin-top:22px}.detail-actions button{flex:1}
.detail-photo-title{font-size:12px;color:var(--muted);margin:8px 0 5px}

/* 분류는 보조 기능이므로 작고 간결하게 */
#modal label[for="cat"],#modal .category-label{font-size:12px!important;margin-bottom:5px!important;color:var(--muted)!important}
#cats{display:flex!important;flex-wrap:wrap!important;gap:5px!important;margin:5px 0 10px!important}
#cats .catbtn{flex:0 0 auto!important;width:auto!important;min-width:0!important;padding:6px 9px!important;border-radius:999px!important;font-size:12px!important;line-height:1.15!important;font-weight:650!important}


.detail-photos{grid-template-columns:repeat(2,1fr)!important;gap:10px!important;margin:10px 0 16px!important}
.detail-photos img{aspect-ratio:4/3!important;object-fit:cover!important;cursor:zoom-in!important}
#photoViewer{position:fixed;inset:0;z-index:9999;background:rgba(20,16,28,.94);display:flex;align-items:center;justify-content:center;padding:18px}
#photoViewer.hidden{display:none!important}
#photoViewer img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:8px}
#photoViewer .viewer-close{position:absolute;top:14px;right:14px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#3b304d;font-size:28px;line-height:42px;padding:0}
#photoViewer .viewer-hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:white;font-size:12px;opacity:.8}
#photoViewer .viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:54px;border:0;border-radius:14px;background:rgba(255,255,255,.88);color:#3b304d;font-size:30px;line-height:54px;padding:0}
#photoViewer .viewer-prev{left:10px}#photoViewer .viewer-next{right:10px}
#photoViewer .viewer-count{position:absolute;top:18px;left:50%;transform:translateX(-50%);color:white;background:rgba(0,0,0,.35);padding:5px 10px;border-radius:999px;font-size:12px}
#photoViewer .viewer-nav:disabled{opacity:.25}


.recipe .cat:empty{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>💜 내 레시피북</h1>
<div class="card">
 <div class="search"><span>🔍</span><input id="search" placeholder="요리 이름이나 재료, 도시락 메뉴로 검색"></div>
 <div class="filters" id="filters"></div>
 <button class="primary" id="add">＋ 새 레시피 추가</button>
</div>
<div class="card"><h2>🍳 내 레시피</h2><div id="list"></div></div>
<div class="card"><button class="secondary" id="backup" style="width:100%">📋 레시피 백업하기</button><div class="note">레시피는 이 기기의 브라우저에 저장됩니다. 기기를 바꾸기 전에 백업해 주세요.</div></div>
</div>


<div class="modal hidden" id="detailModal"><div class="box">
<div class="modalhead"><div><div class="detail-title" id="detailTitle"></div><div class="meta" id="detailMeta"></div></div><button class="close" id="detailClose">×</button></div>
<div id="detailBody"></div>
<div class="detail-actions"><button class="secondary" id="detailEdit">✏️ 수정하기</button><button class="danger" id="detailDelete">🗑️ 삭제하기</button></div>
</div></div>

<div class="modal hidden" id="modal"><div class="box">
<div class="modalhead"><h2 id="mtitle">🍳 레시피 추가</h2><button class="close" id="close">×</button></div>
<label>요리 이름</label><input id="title" placeholder="예: 김치찌개">
<label>분류</label><div class="catbuttons" id="cats"></div><input id="cat" type="hidden" value="한식"><div class="note">🍱 도시락으로 싸고 싶은 메뉴는 <b>도시락</b>을 선택해 두세요.</div>
<label>조리시간</label><input id="time" placeholder="예: 30분">
<label>재료</label><textarea id="ingredients" placeholder="김치 1컵&#10;돼지고기 200g&#10;두부 1/2모"></textarea>
<div class="photo-tools">
<label class="photo-btn">📷 사진 찍기<input id="ingredientCamera" class="hidden" type="file" accept="image/*" capture="environment"></label>
<label class="photo-btn">🖼️ 앨범에서 추가<input id="ingredientGallery" class="hidden" type="file" accept="image/*" multiple></label>
</div><div class="photo-preview" id="ingredientPreview"></div>
<label>만드는 방법</label><textarea id="steps" placeholder="1. 돼지고기를 볶는다.&#10;2. 김치를 넣는다.&#10;3. 끓인다."></textarea>
<div class="photo-tools">
<label class="photo-btn">📷 사진 찍기<input id="stepCamera" class="hidden" type="file" accept="image/*" capture="environment"></label>
<label class="photo-btn">🖼️ 앨범에서 추가<input id="stepGallery" class="hidden" type="file" accept="image/*" multiple></label>
</div><div class="photo-preview" id="stepPreview"></div>
<label>유튜브 / 블로그 링크</label><input id="url" type="url" placeholder="https://...">
<label>내 메모</label><textarea id="memo" placeholder="다음에는 조금 덜 맵게 만들기"></textarea>
<button class="primary" id="save">저장하기</button>
</div></div>


<div id="photoViewer" class="hidden" aria-hidden="true">
<button class="viewer-close" type="button" aria-label="사진 닫기">×</button>
<div class="viewer-count" id="viewerCount"></div>
<button class="viewer-nav viewer-prev" id="viewerPrev" type="button" aria-label="이전 사진">‹</button>
<img id="viewerImage" src="" alt="확대 사진">
<button class="viewer-nav viewer-next" id="viewerNext" type="button" aria-label="다음 사진">›</button>
<div class="viewer-hint">좌우 버튼 또는 손가락으로 넘겨보세요</div>
</div>

<script>
const KEY="myRecipeBook";
const CATS=[["한식","🍚"],["양식","🍝"],["도시락","🍱"],["반찬","🥢"],["국·찌개","🍲"],["간식","🍪"],["샐러드","🥗"],["기타","📦"]];
let raw=[];
try{raw=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){raw=[]}
let data=Array.isArray(raw)?raw.map(r=>({...r,cat:r.cat==="베이킹"?"기타":(r.cat||"기타"),ingredientPhotos:Array.isArray(r.ingredientPhotos)?r.ingredientPhotos:[],stepPhotos:Array.isArray(r.stepPhotos)?r.stepPhotos:[]})):[];
let filter="전체",editId=null,detailId=null,tempIngredientPhotos=[],tempStepPhotos=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const emoji=c=>(CATS.find(x=>x[0]===c)||["","📦"])[1];
function valid(u){try{let x=new URL(u);return x.protocol==="http:"||x.protocol==="https:"}catch(e){return false}}
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert("사진이 너무 많아 저장 공간이 부족해요. 사진 수를 조금 줄여 주세요.");return false}}
saveData();

function renderFilters(){let a=["전체","⭐ 즐겨찾기",...CATS.map(x=>x[0])];$("filters").innerHTML=a.map(x=>`<button class="filterbtn ${x===filter?"active":""}" data-f="${esc(x)}">${x}</button>`).join("");document.querySelectorAll(".filterbtn").forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderFilters();render()})}
function renderCats(sel){$("cat").value=sel||"한식";$("cats").innerHTML=CATS.map(x=>`<button type="button" class="catbtn ${x[0]===$("cat").value?"active":""}" data-c="${esc(x[0])}">${x[1]} ${esc(x[0])}</button>`).join("");document.querySelectorAll(".catbtn").forEach(b=>b.onclick=()=>{$("cat").value=b.dataset.c;document.querySelectorAll(".catbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active")})}

function render(){
 let q=$("search").value.toLowerCase().trim();
 let arr=data.filter(r=>{let hit=[r.title,r.cat,r.ingredients,r.steps,r.memo].join(" ").toLowerCase().includes(q);let f=filter==="전체"||(filter==="⭐ 즐겨찾기"?r.favorite:r.cat===filter);return hit&&f}).sort((a,b)=>b.id-a.id);
 $("list").innerHTML=arr.length?arr.map(r=>`<div class="recipe" onclick="showDetail(${r.id})"><div class="head"><div><div class="title">${emoji(r.cat)} ${esc(r.title)}</div><div class="cat">${r.time?`⏱️ ${esc(r.time)}`:""}</div></div><div class="star" onclick="event.stopPropagation();fav(${r.id})">${r.favorite?"★":"☆"}</div></div><div class="recipe-summary">${r.ingredients?`🥕 ${esc(r.ingredients.split(/\\n/)[0]).slice(0,45)}`:""}</div></div>`).join(""):`<div class="empty">아직 저장한 레시피가 없어요.<br>마음에 드는 레시피를 하나 저장해 보세요 💜</div>`
}

function photoGrid(arr){if(!arr.length)return "";let key="photos_"+Math.random().toString(36).slice(2);window[key]=arr;return `<div class="detail-photos">${arr.map((p,i)=>`<img src="${p}" alt="레시피 사진" onclick="openPhotoViewer(window['${key}'],${i})">`).join("")}</div>`}
function showDetail(id){
 let r=data.find(x=>x.id===id); if(!r)return; detailId=id;
 $("detailTitle").textContent=`${emoji(r.cat)} ${r.title}`;
 $("detailMeta").textContent=[r.cat,r.time?`⏱️ ${r.time}`:""].filter(Boolean).join(" · ");
 $("detailBody").innerHTML=
 `${r.ingredients?`<div class="detail-section"><b>🥕 재료</b><br>${esc(r.ingredients)}</div>`:""}${photoGrid(r.ingredientPhotos)}
 ${r.steps?`<div class="detail-section"><b>👩‍🍳 만드는 방법</b><br>${esc(r.steps)}</div>`:""}${photoGrid(r.stepPhotos)}
 ${r.memo?`<div class="detail-section"><b>💭 내 메모</b><br>${esc(r.memo)}</div>`:""}
 ${valid(r.url)?`<a class="link" href="${esc(r.url)}" target="_blank" rel="noopener">🔗 원본 레시피 바로가기</a>`:""}`;
 $("detailModal").classList.remove("hidden");
}
function closeDetail(){$("detailModal").classList.add("hidden")}
window.showDetail=showDetail;


let viewerPhotos=[],viewerIndex=0,viewerTouchX=null;
function updateViewer(){
 if(!viewerPhotos.length)return;
 $("viewerImage").src=viewerPhotos[viewerIndex];
 $("viewerCount").textContent=(viewerIndex+1)+" / "+viewerPhotos.length;
 $("viewerPrev").disabled=viewerPhotos.length<2;
 $("viewerNext").disabled=viewerPhotos.length<2;
}
function openPhotoViewer(arr,index){
 viewerPhotos=Array.isArray(arr)?arr:[arr];
 viewerIndex=index||0;
 updateViewer();
 $("photoViewer").classList.remove("hidden");
 document.body.style.overflow="hidden";
}
function moveViewer(step){
 if(viewerPhotos.length<2)return;
 viewerIndex=(viewerIndex+step+viewerPhotos.length)%viewerPhotos.length;
 updateViewer();
}
function closePhotoViewer(){
 $("photoViewer").classList.add("hidden");
 $("viewerImage").src="";
 viewerPhotos=[];
 document.body.style.overflow="";
}
window.openPhotoViewer=openPhotoViewer;
$("viewerPrev").onclick=e=>{e.stopPropagation();moveViewer(-1)};
$("viewerNext").onclick=e=>{e.stopPropagation();moveViewer(1)};
$("viewerImage").onclick=e=>e.stopPropagation();
$("photoViewer").onclick=e=>{if(e.target.id==="photoViewer"||e.target.classList.contains("viewer-close"))closePhotoViewer()};
$("photoViewer").addEventListener("touchstart",e=>{viewerTouchX=e.changedTouches[0].screenX},{passive:true});
$("photoViewer").addEventListener("touchend",e=>{
 if(viewerTouchX===null)return;
 let dx=e.changedTouches[0].screenX-viewerTouchX;
 if(Math.abs(dx)>45)moveViewer(dx<0?1:-1);
 viewerTouchX=null;
},{passive:true});

function renderPhotoPreview(){
 $("ingredientPreview").innerHTML=tempIngredientPhotos.map((p,i)=>`<div class="photo-item"><img src="${p}"><button type="button" class="photo-remove" onclick="removePhoto('ingredient',${i})">×</button></div>`).join("");
 $("stepPreview").innerHTML=tempStepPhotos.map((p,i)=>`<div class="photo-item"><img src="${p}"><button type="button" class="photo-remove" onclick="removePhoto('step',${i})">×</button></div>`).join("");
}
function removePhoto(type,i){if(type==="ingredient")tempIngredientPhotos.splice(i,1);else tempStepPhotos.splice(i,1);renderPhotoPreview()}
window.removePhoto=removePhoto;

function compressImage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=e=>{
   const img=new Image();
   img.onload=()=>{
    const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    resolve(c.toDataURL("image/jpeg",0.78));
   };
   img.onerror=reject;img.src=e.target.result;
  };
  reader.onerror=reject;reader.readAsDataURL(file);
 });
}
async function addFiles(files,type){
 const target=type==="ingredient"?tempIngredientPhotos:tempStepPhotos;
 for(const file of Array.from(files||[])){
  if(!file.type.startsWith("image/"))continue;
  try{target.push(await compressImage(file))}catch(e){}
 }
 renderPhotoPreview();
}
["ingredientCamera","ingredientGallery"].forEach(id=>$(id).onchange=async e=>{await addFiles(e.target.files,"ingredient");e.target.value=""});
["stepCamera","stepGallery"].forEach(id=>$(id).onchange=async e=>{await addFiles(e.target.files,"step");e.target.value=""});

function open(id=null){
 editId=id;$("mtitle").textContent=id?"✏️ 레시피 수정":"🍳 레시피 추가";
 if(id){
  let r=data.find(x=>x.id===id);$("title").value=r.title;$("time").value=r.time||"";$("ingredients").value=r.ingredients||"";$("steps").value=r.steps||"";$("url").value=r.url||"";$("memo").value=r.memo||"";
  tempIngredientPhotos=[...(r.ingredientPhotos||[])];tempStepPhotos=[...(r.stepPhotos||[])];renderCats(r.cat);
 }else{
  ["title","time","ingredients","steps","url","memo"].forEach(x=>$(x).value="");tempIngredientPhotos=[];tempStepPhotos=[];renderCats("한식");
 }
 renderPhotoPreview();$("modal").classList.remove("hidden")
}
function close(){$("modal").classList.add("hidden")}
function fav(id){let r=data.find(x=>x.id===id);r.favorite=!r.favorite;saveData();render()}
function del(id){if(confirm("이 레시피를 삭제할까요?")){data=data.filter(x=>x.id!==id);saveData();closeDetail();render()}}
window.fav=fav;window.del=del;

$("add").onclick=()=>open();$("close").onclick=close;$("modal").onclick=e=>{if(e.target.id==="modal")close()};$("search").oninput=render;
$("detailClose").onclick=closeDetail;$("detailModal").onclick=e=>{if(e.target.id==="detailModal")closeDetail()};
$("detailEdit").onclick=()=>{let id=detailId;closeDetail();open(id)};
$("detailDelete").onclick=()=>del(detailId);

$("save").onclick=()=>{
 let title=$("title").value.trim();if(!title){alert("요리 이름을 입력해 주세요.");return}
 let url=$("url").value.trim();if(url&&!valid(url)){alert("링크를 확인해 주세요. https://로 시작하는 주소를 넣어주세요.");return}
 let o={title,cat:$("cat").value,time:$("time").value.trim(),ingredients:$("ingredients").value.trim(),ingredientPhotos:[...tempIngredientPhotos],steps:$("steps").value.trim(),stepPhotos:[...tempStepPhotos],url,memo:$("memo").value.trim()};
 let backup=JSON.stringify(data);
 if(editId)Object.assign(data.find(x=>x.id===editId),o);else data.push({id:Date.now(),favorite:false,...o});
 if(saveData()){close();render()}else{data=JSON.parse(backup)}
};
$("backup").onclick=()=>{if(!data.length){alert("백업할 레시피가 없어요.");return}let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="내_레시피북_백업.json";a.click();URL.revokeObjectURL(u)};
renderFilters();render();
</script>
</body>
</html>
